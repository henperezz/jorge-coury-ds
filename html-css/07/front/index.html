<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <section class="menuLogin activated">
      <h1>Bem-vindo!</h1>

      <div class="inputs">
        <label for="Login">Login</label>
        <input class="input" type="text" placeholder="Digite seu login" />
        <label for="password">Senha</label>
        <input class="input" type="password" placeholder="Digite sua senha" />
      </div>

      <div class="buttonLogin">
        <p class="textButton">Entrar</p>
      </div>

      <p class="signUpText">
        Não tem conta? <a class="signUpLink" href="#">Clique aqui</a>
      </p>
    </section>

    <!-- Sign Up -->

    <section class="menuSignUp">
      <h1>Bem-vindo!</h1>
      <h2>Crie sua conta</h2>

      <div class="inputs">
        <label for="email">Email</label>
        <input class="input" type="email" placeholder="exemplo@email.com" />

        <label for="telefone">Telefone</label>
        <input
          class="input"
          type="tel"
          name=""
          id=""
          placeholder="+55 (DDD) + número"
        />

        <label for="nome">Nome</label>
        <input class="input" type="text" placeholder="Seu nome completo" />

        <label for="senha">Senha</label>
        <input
          class="input"
          type="password"
          name=""
          id=""
          placeholder="Digite sua senha"
        />

        <div class="checkboxDiv">
          <input
            class="checkbox"
            type="checkbox"
            name=""
            id=""
            placeholder=""
          />
          <label class="textCheckbox" for=""
            >Aceito que entrem em contato comigo por SMS e Whatsapp</label
          >
        </div>

        <p class="autorizationText">
          Ao "Continuar", aceito os <a href="#">Termos e condições</a> e
          autorizo o uso dos meus dados de acesso com a
          <a href="">Declaração de privacidade</a>.
        </p>

        <div class="buttonCadastro"><p class="textButton">Cadastrar</p></div>
      </div>
    </section>
  </body>
</html>
