<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VetZoo</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="shortcut icon"
      href="assets/Logo-VetZoo.png"
      type="image/x-icon"
    />
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Roboto+Mono:ital,wght@0,100..700;1,100..700&display=swap");
      @import url("https://fonts.googleapis.com/css2?family=Roboto+Mono:ital,wght@0,100..700;1,100..700&family=Ultra&display=swap");
    </style>
  </head>
  <body>
    <header class="header">
      <div class="logo_nome">
        <a href="index.html"
          ><img src="assets/Logo-VetZoo.png" alt="Logo VetZoo"
        /></a>
        <div class="nome">
          <h1 class="nome_1">Vet</h1>
          <h1 class="nome_2">Zoo</h1>
        </div>

        <nav>
          <ul class="header_list">
            <li><a class="links_header" href="#">Início</a></li>
            <li><a class="links_header" href="#">Cadastro de Tutores</a></li>
            <li><a class="links_header" href="#">Cadastro de Animais</a></li>
            <li><a class="links_header" href="#">Consultas</a></li>
          </ul>
        </nav>
      </div>
    </header>

    <section class="banner">
      <div class="titulos">
        <h2 class="titulo_1">Sistema de</h2>
        <h2 class="titulo_2">Gerenciamento</h2>
        <h2 class="titulo_3">para Clínicas</h2>
      </div>
      <img
        class="banner_amora"
        src="assets/Amora_Banner.png"
        alt="Banner Cachorro"
      />
    </section>
  </body>
</html>
